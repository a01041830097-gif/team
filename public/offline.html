<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>오프라인 - 팀 주간업무보고</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    color: #23282f;
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont,
      system-ui, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 360px;
    width: 100%;
    text-align: center;
  }
  .icon {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: #2160c4;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    font-size: 24px;
  }
  h1 { font-size: 17px; margin: 0 0 8px; }
  p { font-size: 14px; line-height: 1.6; color: #667085; margin: 0 0 20px; }
  button {
    appearance: none;
    border: none;
    background: #2160c4;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 20px;
    min-height: 44px;
    border-radius: 8px;
    cursor: pointer;
  }
  button:active { opacity: 0.85; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📶</div>
    <h1>인터넷 연결이 끊겼습니다</h1>
    <p>오프라인 상태에서는 마지막으로 불러온 화면만 확인할 수 있어요.<br />연결이 복구되면 자동으로 최신 내용을 불러옵니다.</p>
    <button onclick="location.reload()">다시 시도</button>
  </div>
</body>
</html>
